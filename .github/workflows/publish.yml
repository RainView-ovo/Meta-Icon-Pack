name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # sdkmanager (cmdline-tools 22.0) refuses to run on JDK 11, while
      # Gradle 6.7.1 / AGP 4.2.0 refuse to run on JDK 17+. Install JDK 17
      # first for the SDK tooling, then switch to JDK 11 for the build.
      - name: Set up JDK 17 for SDK tooling
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install platform and build-tools
        run: sdkmanager --install "platforms;android-30" "build-tools;30.0.3"

      - name: Set up JDK 11 for Gradle
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'buildSrc/src/main/java/*.kt') }}
          restore-keys: gradle-${{ runner.os }}-

      # app/build.gradle already signs the release build with the bundled
      # test keystore (app/frames.jks, alias/password: frames).
      - name: Build signed release APK
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName = "\K[^"]+' buildSrc/src/main/java/Blueprint.kt)
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$APK"
          echo "apk_name=Meta-Icon-Pack-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-b${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          cp "$APK" "Meta-Icon-Pack-${VERSION}.apk"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="${{ steps.meta.outputs.apk_name }}"
          "$ANDROID_SDK_ROOT/build-tools/30.0.3/apksigner" verify --print-certs "$APK"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Meta-Icon Pack ${{ steps.meta.outputs.version }} (build ${{ github.run_number }})
          body: |
            Meta-Icon Pack ${{ steps.meta.outputs.version }}
            Built from ${{ github.sha }} by GitHub Actions.

            > Signed with the bundled test keystore (`app/frames.jks`), not a production key.
          files: ${{ steps.meta.outputs.apk_name }}
          fail_on_unmatched_files: true
